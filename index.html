<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sentiment Arcade</title>
<style>
:root{--bg:#0b1220;--card:#131c2f;--card2:#1a2540;--line:#26335a;--tx:#e8eefc;--mut:#8fa0c7;--acc:#4f8cff;--pos:#22c58b;--neg:#ff5b6e;--neu:#f5b942;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1b2c5a 0,var(--bg) 60%);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.5px}
h2{font-size:21px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--mut)}
.pill b{color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.grid{display:grid;gap:12px}
.menu .tile{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:var(--r);padding:16px;cursor:pointer;font:inherit;transition:.15s}
.tile:hover,.tile:active{border-color:var(--acc);transform:translateY(-2px)}
.tile .ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:17px}.tile span{color:var(--mut);font-size:14px}
.tile .done{margin-left:auto;color:var(--pos);font-weight:700}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
button.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
button.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:6px 0}
/* pipeline */
.slots{display:grid;gap:8px;margin:12px 0}
.slot{min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--mut)}
.slot .n{width:24px;height:24px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:12px;flex:none}
.slot.f{border-style:solid;border-color:var(--acc);color:var(--tx);background:var(--card2)}
.slot.ok{border-color:var(--pos);background:#0f2b25}.slot.bad{border-color:var(--neg);background:#34161d}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:9px 14px;cursor:pointer;font:inherit;font-size:14px}
.chip:active{transform:scale(.95)}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;perspective:600px;cursor:pointer;border:0;background:none;padding:0}
.mc i{display:block;position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d;font-style:normal}
.mc.open i,.mc.done i{transform:rotateY(180deg)}
.mc u,.mc s{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;text-align:center;backface-visibility:hidden;text-decoration:none;padding:4px;font-size:clamp(10px,2.7vw,13px);font-weight:600;line-height:1.2}
.mc u{background:linear-gradient(135deg,#2a4a9a,#4f8cff);font-size:26px}
.mc s{transform:rotateY(180deg);background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.mc.done s{border-color:var(--pos);background:#0f2b25}
/* sorter */
.head{font-size:21px;font-weight:700;text-align:center;padding:26px 12px;background:var(--card2);border-radius:14px;margin:12px 0;min-height:110px;display:grid;place-items:center}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three button{border:0;border-radius:12px;padding:14px 4px;font:inherit;font-weight:700;color:#06101f;cursor:pointer}
.b-pos{background:var(--pos)}.b-neu{background:var(--neu)}.b-neg{background:var(--neg)}
.fb{padding:12px 14px;border-radius:12px;margin-top:12px;font-size:14px;background:var(--card2);border-left:4px solid var(--acc)}
.fb.ok{border-color:var(--pos)}.fb.no{border-color:var(--neg)}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:var(--acc);transition:width .3s}
/* quiz */
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px 14px;font:inherit;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.ok{background:#0f2b25;border-color:var(--pos)}.opt.no{background:#34161d;border-color:var(--neg)}
.q{font-size:19px;font-weight:650}
.timer{height:6px;background:var(--card2);border-radius:9px;overflow:hidden}
.timer div{height:100%;background:var(--neu);width:100%}
.big{font-size:56px;font-weight:800;text-align:center;margin:6px 0}
.lb{width:100%;border-collapse:collapse;font-size:14px}.lb td{padding:8px 4px;border-bottom:1px solid var(--line)}.lb td:last-child{text-align:right;font-weight:700}
#qr{display:grid;place-items:center;background:#fff;border-radius:12px;padding:10px;width:fit-content;margin:8px auto}
.hidden{display:none!important}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="wrap">
  <div class="top"><div class="pill">Total XP <b id="xp">0</b></div><div class="pill" id="who">Guest</div></div>

  <!-- HOME -->
  <section id="home">
    <h1>📈 Sentiment Arcade</h1>
    <p class="sub">NLP Sentiment Analysis Based Trading Strategies — play, learn, climb the board.</p>
    <div class="card"><div class="row"><input type="text" id="nm" maxlength="16" placeholder="Enter your name" style="flex:1"><button class="btn" onclick="setName()">Save</button></div></div>
    <div class="grid menu">
      <button class="tile" onclick="go('pipe')"><div class="ic">🧩</div><div><b>Puzzle 1 · Build the Pipeline</b><span>Put text → trade in the right order</span></div><div class="done" id="d-pipe"></div></button>
      <button class="tile" onclick="go('mem')"><div class="ic">🃏</div><div><b>Puzzle 2 · Match Pairs</b><span>Pair each discipline or paper with its idea</span></div><div class="done" id="d-mem"></div></button>
      <button class="tile" onclick="go('sort')"><div class="ic">📰</div><div><b>Puzzle 3 · Headline Sorter</b><span>Read like a finance-aware model</span></div><div class="done" id="d-sort"></div></button>
      <button class="tile" onclick="go('quiz')"><div class="ic">⚡</div><div><b>Speed Quiz · 12 questions</b><span>20s each, streak bonuses</span></div><div class="done" id="d-quiz"></div></button>
      <button class="tile" onclick="go('lb')"><div class="ic">🏆</div><div><b>Leaderboard</b><span>Top scores on this device</span></div></button>
    </div>
    <div class="card" style="text-align:center"><b>Scan to play</b><div id="qr"></div><div class="sub" style="margin:0;font-size:13px">Thank you</div></div>
    <p class="sub" style="text-align:center;font-size:12px">Group 6 · RA2311056010254 Aryan Raj · RA2311056010255 Shifa · RA2311056010312 Shana</p>
  </section>

  <!-- GAME VIEW -->
  <section id="game" class="hidden"><button class="back" onclick="go('home')">← Menu</button><div id="stage"></div></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{return JSON.parse(localStorage.getItem('sa_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('sa_'+k,JSON.stringify(v))}catch(e){}}};
let xp=store.get('xp',0),name=store.get('name',''),done=store.get('done',{});
function paint(){$('#xp').textContent=xp;$('#who').textContent=name||'Guest';$('#nm').value=name;for(const k of['pipe','mem','sort','quiz'])$('#d-'+k).textContent=done[k]?'✓':''}
function addXp(n,k){xp+=n;store.set('xp',xp);if(k){done[k]=1;store.set('done',done)}paint()}
function setName(){name=$('#nm').value.trim().slice(0,16);store.set('name',name);paint()}
function go(v){
  $('#home').classList.toggle('hidden',v!=='home');$('#game').classList.toggle('hidden',v==='home');
  if(v==='home')return paint();
  ({pipe,mem,sort,quiz,lb})[v]();window.scrollTo(0,0)
}
const stage=h=>$('#stage').innerHTML=h;

/* ---------- Puzzle 1: pipeline ---------- */
function pipe(){
  const order=['Collect Text','Clean & Dedup','Entity ID','Finance Sentiment','Aggregate Scores','Build Signal','Execute & Monitor'];
  let pool=sh(order),slots=[],tries=0;
  const draw=(res)=>{
    stage(`<h2>🧩 Build the Pipeline</h2><p class="sub">Tap steps in order, first → last. Tap a filled slot to remove it.</p>
    <div class="slots">${order.map((_,i)=>`<div class="slot ${slots[i]?'f':''} ${res?(slots[i]===order[i]?'ok':'bad'):''}" onclick="P.rm(${i})"><span class="n">${i+1}</span>${slots[i]||'…'}</div>`).join('')}</div>
    <div class="chips">${pool.map(c=>`<button class="chip" onclick="P.add('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="btn" onclick="P.chk()" ${slots.length<7?'disabled':''}>Check</button><button class="btn ghost" onclick="pipe()">Shuffle</button><span class="pill">Tries <b>${tries}</b></span></div><div id="msg"></div>`)};
  window.P={add(c){pool=pool.filter(x=>x!==c);slots.push(c);draw()},
    rm(i){if(!slots[i])return;pool.push(slots[i]);slots.splice(i,1);draw()},
    chk(){tries++;const ok=slots.every((s,i)=>s===order[i]);draw(true);
      if(ok){const g=Math.max(20,100-tries*20);addXp(g,'pipe');confetti();$('#msg').innerHTML=`<div class="fb ok">🎉 Perfect! +${g} XP.<br>Every step is a place to improve the signal — or introduce bias.</div>`}
      else{$('.slots').classList.add('shake');$('#msg').innerHTML=`<div class="fb no">Green = right spot, red = wrong. Remove the red ones and retry.</div>`}}};
  draw()
}

/* ---------- Puzzle 2: memory ---------- */
function mem(){
  const pairs=[['Point-in-time data','Prevents look-ahead bias'],['Walk-forward test','Prevents overfitting'],['Realistic costs','Prevents friction blindness'],['Ablation tests','Prevents false attribution'],['Timestamp logic','Prevents impossible fills'],['Tetlock (2007)','Media pessimism & markets'],['Loughran & McDonald','Finance-specific word list'],['Bollen et al. (2011)','Twitter mood & the Dow']];
  const cards=sh(pairs.flatMap((p,i)=>[{i,t:p[0]},{i,t:p[1]}]));
  let open=[],found=0,moves=0,lock=false;
  stage(`<h2>🃏 Match Pairs</h2><p class="sub">Find each discipline/paper and what it is about.</p><div class="row" style="margin-bottom:10px"><span class="pill">Moves <b id="mv">0</b></span><span class="pill">Pairs <b id="pf">0</b>/8</span></div>
  <div class="mem">${cards.map((c,k)=>`<button class="mc" data-k="${k}"><i><u>?</u><s>${c.t}</s></i></button>`).join('')}</div><div id="msg"></div>`);
  document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;if(lock||b.classList.contains('open')||b.classList.contains('done'))return;
    b.classList.add('open');open.push(k);
    if(open.length===2){moves++;$('#mv').textContent=moves;const[a,c]=open;const A=document.querySelectorAll('.mc')[a],C=document.querySelectorAll('.mc')[c];
      if(cards[a].i===cards[c].i){A.className=C.className='mc done';found++;$('#pf').textContent=found;open=[];
        if(found===8){const g=Math.max(30,120-moves*4);addXp(g,'mem');confetti();$('#msg').innerHTML=`<div class="fb ok">🎉 Cleared in ${moves} moves! +${g} XP</div>`}}
      else{lock=true;setTimeout(()=>{A.classList.remove('open');C.classList.remove('open');open=[];lock=false},800)}}
  })
}

/* ---------- Puzzle 3: sorter ---------- */
function sort(){
  const H=[
    ['Company raises full-year revenue guidance',['pos'],'Clear upgrade to outlook. Generic and finance-aware readings agree: positive.'],
    ['Profit falls less than feared',['pos'],'A generic word count sees “falls” = negative. Finance-aware: it beat low expectations → positive.'],
    ['Firm beats estimates but cuts guidance',['neg'],'Word count says “beats” = positive. But outlook matters more → mixed, likely negative.'],
    ['Board meeting scheduled for next Thursday',['neu'],'No new information about value → neutral.'],
    ['Company settles long-running liability claim',['pos','neu'],'“liability” and “claim” look negative, but a settlement removes uncertainty → neutral or positive.'],
    ['Not a bad quarter, analysts say',['pos'],'Naive: “bad” = negative. With negation handled → mildly positive.'],
    ['Regulator opens probe into accounting practices',['neg'],'Regulatory and accounting risk → negative.']
  ],Q=sh(H);let i=0,sc=0;
  const draw=()=>{
    if(i>=Q.length){const g=sc*15;addXp(g,'sort');if(sc>=6)confetti();return stage(`<h2>📰 Done!</h2><div class="big">${sc}/${Q.length}</div><p class="sub" style="text-align:center">${sc>=6?'You read like FinBERT.':'Context decides meaning — expectations, negation, domain vocabulary.'} +${g} XP</p><div class="row" style="justify-content:center"><button class="btn" onclick="sort()">Play again</button></div>`)}
    stage(`<h2>📰 Headline Sorter</h2><p class="sub">How would a <b>finance-aware</b> model rate this?</p><div class="bar"><div style="width:${i/Q.length*100}%"></div></div>
    <div class="head">“${Q[i][0]}”</div><div class="three"><button class="b-pos" onclick="S(this,'pos')">Positive</button><button class="b-neu" onclick="S(this,'neu')">Neutral</button><button class="b-neg" onclick="S(this,'neg')">Negative</button></div><div id="msg"></div>`)};
  window.S=(b,a)=>{const ok=Q[i][1].includes(a);if(ok)sc++;document.querySelectorAll('.three button').forEach(x=>x.disabled=true);
    $('#msg').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Correct. ':'❌ Not quite. '}${Q[i][2]}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="N()">Next →</button></div>`;
  };
  window.N=()=>{i++;draw()};draw()
}

/* ---------- Quiz ---------- */
const QZ=[
['What does a sentiment model output for a sentence in the slides?','A score and a confidence',['A price target','A stock ticker','A buy order'],'A sentence goes in; a score and confidence come out.'],
['“Regulator opens probe into accounting practices” gets which illustrative score?','−0.7',['+0.8','0.0','+0.3'],'Negative example: −0.7.'],
['Which is NOT one of the three levels of analysis?','Portfolio level',['Document level','Sentence level','Entity level'],'Levels: document, sentence, entity.'],
['Which text source is fast but suffers from duplicates and source bias?','News wires & portals',['SEC 10-K filings','Central bank minutes','Earnings call scripts'],'News is fast and broad, but duplicates and bias creep in.'],
['Why did Loughran & McDonald build a finance-specific word list?','Many everyday “negative” words are not negative in 10-Ks',['Generic lists were too slow','Filings are in code','Twitter had no word list'],'Words like “liability” are routine in filings.'],
['Tetlock (2007) linked negative tone in a WSJ column to…','Short-term downward price pressure that partly reversed',['Permanent crashes','Higher trading volume only','No effect at all'],'The effect was modest and partly reversed.'],
['In S(t) = Σ wᵢ·sᵢ·e^(−λ(t−tᵢ)), what does λ control?','How fast news goes stale',['Source credibility','Article score','Rolling window length'],'λ is the decay rate.'],
['With rule Z > +1 → long, what should you do when −1 ≤ Z ≤ +1?','Stay flat',['Go long','Go short','Double the position'],'Between the thresholds: stay flat.'],
['Which strategy uses sentiment as a risk-on / risk-off overlay?','Regime overlay',['Event-driven','Cross-sectional ranking','Pairs trading'],'Regime overlay supports an existing strategy.'],
['Which bias does point-in-time data prevent?','Look-ahead bias',['Survivorship tax','Latency drift','Sarcasm bias'],'Was this text available then, in this form?'],
['Why do duplicated stories hurt live trading?','They make attention look like breadth',['They raise fees','They delay orders','They remove entities'],'Data contamination: attention ≠ breadth.'],
['What is the first stage of the research loop?','Baseline with a transparent lexicon',['Live guardrails','Hybrid signal','Paper trading'],'Start with a lexicon and a simple benchmark.'],
['“Score ≠ weight” means…','Confidence must pass through risk and liquidity limits before sizing',['Scores are random','Weights ignore volatility','Short positions are banned'],'Keep the translation explicit.'],
['Which is future scope in the slides?','Large language models for long transcripts and filings',['Removing price data','Manual headline reading','Dropping backtests'],'LLMs, multimodal signals, regional languages.']
];
function quiz(){
  const Q=sh(QZ).slice(0,12);let i=0,sc=0,streak=0,best=0,t,tm;
  const next=()=>{clearInterval(tm);if(i>=Q.length)return end();
    const[q,a,w]=Q[i],o=sh([a,...w]);let left=20;
    stage(`<div class="row" style="justify-content:space-between"><span class="pill">Q <b>${i+1}</b>/12</span><span class="pill">Score <b>${sc}</b></span><span class="pill">🔥 <b>${streak}</b></span></div>
    <div class="timer" style="margin:10px 0"><div id="tb"></div></div><div class="q">${q}</div><div class="opts">${o.map(x=>`<button class="opt">${x}</button>`).join('')}</div><div id="msg"></div>`);
    const fin=(pick)=>{clearInterval(tm);const ok=pick===a;
      document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===a)b.classList.add('ok');else if(b.textContent===pick)b.classList.add('no')});
      if(ok){streak++;best=Math.max(best,streak);sc+=100+left*5+(streak>1?streak*10:0)}else streak=0;
      $('#msg').innerHTML=`<div class="fb ${ok?'ok':'no'}">${pick===null?'⏰ Time up. ':ok?'✅ Correct! ':'❌ '}${Q[i][3]}</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">${i<11?'Next →':'Finish'}</button></div>`;
      $('#nx').onclick=()=>{i++;next()};};
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>fin(b.textContent));
    tm=setInterval(()=>{left-=.1;$('#tb').style.width=left/20*100+'%';if(left<=0)fin(null)},100)};
  const end=()=>{const rank=sc>1700?'Quant Legend 🏅':sc>1200?'Signal Hunter 🎯':sc>700?'Analyst 📊':'Intern 🌱';
    const lb=store.get('lb',[]);lb.push({n:name||'Guest',s:sc});lb.sort((a,b)=>b.s-a.s);store.set('lb',lb.slice(0,10));
    addXp(Math.round(sc/10),'quiz');if(sc>700)confetti();
    stage(`<h2>⚡ Quiz complete</h2><div class="big">${sc}</div><p class="sub" style="text-align:center">${rank} · best streak ${best}</p><div class="row" style="justify-content:center"><button class="btn" onclick="quiz()">Retry</button><button class="btn ghost" onclick="go('lb')">Leaderboard</button></div>`)};
  next()
}

function lb(){const l=store.get('lb',[]);
  stage(`<h2>🏆 Leaderboard</h2><p class="sub">Best quiz scores on this device.</p><div class="card">${l.length?`<table class="lb">${l.map((r,k)=>`<tr><td>${['🥇','🥈','🥉'][k]||k+1}</td><td>${r.n.replace(/[<>&]/g,'')}</td><td>${r.s}</td></tr>`).join('')}</table>`:'No scores yet — take the quiz!'}</div>`)}

/* ---------- confetti ---------- */
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const p=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20,vx:Math.random()*4-2,vy:Math.random()*4+2,s:Math.random()*8+4,c:`hsl(${Math.random()*360},85%,60%)`}));let f=0;
  (function a(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.05;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.s,q.s)});if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

paint();
try{if(/^https?:/.test(location.protocol)&&window.QRCode)new QRCode($('#qr'),{text:location.href,width:150,height:150});else $('#qr').parentElement.querySelector('#qr').style.display='none'}catch(e){}
</script>
</body>
</html>
